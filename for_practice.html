<!DOCTYPE html>
<html>
    <head>
        <title>연습장</title>
        <meta charset="UTF-8">
        <style>
            .container{
                height : 150px;
                display : flex;
                border : solid 1px red;
                flex-direction : row;
                flex-wrap: wrap;
                justify-content : flex-start;
                justify-content : space-around;
                

            }

            .container2{
                display : grid;
                grid-template-columns : 100px 100px 100px;
                grid-gap : 10px;

                border: dotted blue 5px;
            }

            

            .h{
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size : 50px;

            }
            .h:hover{
                text-decoration:underline;
            }
            
        </style>
    </head>
    <body>
        <div class="container">
            <p class="h">hobbies</p>
            <p class="h">skills</p>
            <p class="h">my love</p>
        </div>
        <div class="container2">
            <div style="font-family: 'Times New Roman', Times, serif; border : solid red 1px; font-size : 100px">a</div>
            <div style="font-family: 'Times New Roman', Times, serif; border : solid red 1px; font-size : 100px">b</div>
            <div style="font-family: 'Times New Roman', Times, serif; border : solid red 1px ;font-size: 100px">c</div>
        </div>
    </body>
</html>
