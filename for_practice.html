<!DOCTYPE html>
<html>
    <head>
        <title>연습장</title>
        <meta charset="UTF-8">
        <style>
            
            div{
                display:flex;
                flex-direction : row;
                background-color : cyan;
                width : 600px;
                height: 1200px;

                justify-content : flex-start;
                flex-wrap : wrap;
                justify-content : space-around;
                
            }
            h1{
                background-color: red;
                color : white;
                font-family : 'Times New Roman', Times, serif;
                border : 5px dotted black;
                font-size : 30px;
                width : 50px;
                height: 50px;
                text-shadow : 5px 5px 5px black;
            }
        </style>
    </head>
    <body>
        <div>
            <h1 style="order:3;">1</h1>
            <h1 style="order:3; flex-grow : 1;">2</h1>
            <h1 style="order:1;">3</h1>
        </div>
    </body>
</html>
