<!DOCTYPE html>
<html>
    <head>
        <title>cal</title>
        <meta charset="UTF-8">
        <style>
            body{
                height : 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items:center;
                background-color: darkkhaki;
            }
            .cal{
                display:grid;
                grid-template-columns: 100px 100px 100px 100px;
                grid-template-rows: 100px 100px 100px 100px 100px;
                border:2px solid black;
                border-radius: 20px;
                
            }
            .cal h1{
                grid-column:1/ span 4;
                display: flex;
                justify-content: flex-end;
                padding-right : 30px;
                /* flex-wrap : wrap; */
                /* border: 1px red solid; */
            }
            div div{
                border: 1px black solid;
                border-radius: 10px;
                display:flex;
                justify-content: center;
                align-items: center;
                font-size: 30px;
                font-family: 'Times New Roman Bold Italic', Times, serif;
            }
            div div:hover{
                background-color: gold;
                /* box-shadow: 5px 5px 5px black; */
            }
            #header{
                text-align:center;
                font-size: 70px;
                transform: skew(5deg, 5deg);
                margin : 100px;
                font-family: 'Times New Roman Bold Italic', Times, serif;
                
            }
        </style>
    </head>
    
    <body>
        <h1 id="header">minimal calculator</h1>
        <div class="cal">
            <h1 id="n">0</h1>
            <div>+</div>
            <div>-</div>
            <div>*</div>
            <div>/</div>
            <div>=</div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>delete</div>
            <div>reset</div>
        </div>

        <script>
            let n = document.getElementById("n");

            let allDivs = document.querySelectorAll(".cal div");
            
            let num =[];

            for(let i = 5; i<=13; i++){
                num.push(allDivs[i]);
            }
            
            for(let i = 0; i<= 8 ; i++){
                num[i].onclick = function(){
                    if(n.innerHTML === "0"){
                        n.innerHTML = String(num[i].innerHTML);
                    }
                    else{
                        n.innerHTML += String(num[i].innerHTML);
                    }
                }
            }

            let storageOperator = [];

            function funPlus(){
                let s = Number(n.innerHTML);
                storageOperator.push(s);
                let operator = "+";
                storageOperator.push(operator);
                n.innerHTML = "0";
            }

            function forMinus(){
                let s = Number(n.innerHTML);
                storageOperator.push(s);
                let operator = "-";
                storageOperator.push(operator);
                n.innerHTML = "0";
            }

            function forMultiple(){
                let s = Number(n.innerHTML);
                storageOperator.push(s);
                let operator = "*";
                storageOperator.push(operator);
                n.innerHTML = "0";
            }

            function forDivide(){
                let s = Number(n.innerHTML);
                storageOperator.push(s);
                let operator = "/";
                storageOperator.push(operator);
                n.innerHTML = "0";
            }

            function resultt(){
                storageOperator.push(Number(n.innerHTML));
                let i = 0;
                let result;
                while(i < storageOperator.length){
                    if(typeof storageOperator[i] != "number"){
                        if(storageOperator[i] ==="+"){
                            result = storageOperator[i-1] + storageOperator[i+1];
                        }
                        e   lse if(storageOperator[i] === "-"){
                            result = storageOperator[i-1] - storageOperator[i+1];
                        }
                        else if(storageOperator[i] === "*"){
                            result = storageOperator[i-1] * storageOperator[i+1];
                        }
                        else if(storageOperator[i] === "/"){
                            result = storageOperator[i-1] / storageOperator[i+1];
                        }
                    }
                    n.innerHTML = String(result);
                    i++;
                }
                storageOperator = [];
                
            }



            let plus = allDivs[0].addEventListener("click", funPlus);
            let minus = allDivs[1].addEventListener("click", forMinus);
            let multiple = allDivs[2].addEventListener("click", forMultiple);
            let divide = allDivs[3].addEventListener("click", forDivide);
            let result = allDivs[4].addEventListener("click", resultt);
    
        </script>
    </body>
</html>
