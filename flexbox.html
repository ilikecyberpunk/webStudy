
<!DOCTYPE html>
<html>
    <head>
        <title>flexbox연습하기</title>
        <meta charset="UTF-8">
        
        <style>
            body {
                background: beige;
                display: flex;              /* flexbox 활성화 */
                border: 5px dotted black;
                height: 100%;              /* 컨테이너 높이 */
                width: 100%;               /* 컨테이너 너비 */

                /* flex 방향 설정 */
                flex-direction: row;        /* 가로 방향으로 배치 */

                /* 줄바꿈 설정 */
                flex-wrap: wrap;            /* 공간 부족하면 줄바꿈 허용 */

                /* 주축(가로축) 정렬 방식 */
                justify-content: center;    /* 아이템들을 가로 중앙에 정렬 */

                /* 교차축(세로축) 정렬 방식 */
                align-items: center;        /* 한 줄 안에서 세로 중앙 정렬 */
                align-content: center;      /* 여러 줄 전체를 세로 중앙 정렬 */
            }

            .item {
                border: 1px solid red;
                width: 80px;                /* 아이템 너비 */
                height: 80px;               /* 아이템 높이 */
                display: flex;              /* 안쪽 텍스트도 중앙 정렬 */
                justify-content: center;
                align-items: center;
                font-size: 20px;            /* 숫자 크게 표시 */
                background: lightyellow;
            }
        </style>
    </head>
    <body>

        <!-- order: 숫자가 작을수록 앞에 배치됨 -->
        <div class="item" style="order:0;">1</div>
        <div class="item" style="order:1;">2</div>
        <div class="item" style="order:2;">3</div>
        <div class="item" style="order:3;">4</div>
        <div class="item" style="order:4;">5</div>
        <div class="item" style="order:5;">6</div>
        <div class="item" style="order:6;">7</div>
        <div class="item" style="order:7;">8</div>
        <div class="item" style="order:8; flex-grow : 1;">9</div>

        <!-- flex-grow:1; == 화면에 꽉 채우게  -->
        <div class="item" style="order:-1; flex-grow:1;">10</div> <!-- 맨 앞에 오도록 설정 -->

        <!-- 참고자료 링크 -->
        <a style="border:5px solid black; margin-top:20px; display:block;" 
           href="https://developer.mozilla.org/ko/docs/Learn_web_development/Core/CSS_layout/Flexbox">
           참고자료 - 까먹을때 쓰삼
        </a>
    </body>
</html>
