<!DOCTYPE html>
<html>
    <head>
        <title>flexbox정리</title>
        <meta charset = "UTF-8">
        <style>
            /* flexbox = 콘테이너 안에 아이템이 있는 구성 */
            /* 수직축 (main axis) 과 수평축 (cross axis) 이 있다 */
            /* 중심축을 main axis로 두면 cross axis는 반대축이 된다 */

        
            .container{
                background:beige;
                height : 100vh;
                border : 1px solid black;

                display : flex;

                /* 기본 축 설정 : row, row-reverse, column, column-reverse */
                flex-direction : row;

                /* 아이템들이 넘칠때 줄바꿈여부  wrap, nowrap */
                /* reverse도 있긴 함 */
                flex-wrap : wrap;

                /* 아이템 배치 방법 justify-content */

                    /* 왼-오 정렬 : flex-start */
                    /* 반대 flex-end */
                    justify-content : flex-start;
                    
                    /* 아이템 사이 공간 띄우기 */
                    /* 그냥 띄우기 space around */
                    /* 일정 간격으로 띄우기 space evenly */
                    justify-content : space-around;
                
            
                /* 반대 축에서 아이템 정렬 방식 */
                align-items : center;
                


            }
            .item{
                width : 50px;
                height : 50px;
            }
            .item1{
                background-color: red;
            }
            .item2{
                background-color: blue;
            }
            .item3{
                background-color: yellow;
            }


        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="item item1">1</h1>
            <h1 class="item item2">2</h1>
            <h1 class="item item3">3</h1>
        </div>
    </body>
</html>
